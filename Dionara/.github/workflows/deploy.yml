name: Deploy Dionara to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            Dionara/package-lock.json

      - name: Install dependencies & Build
        run: |
          if [ -d "Dionara" ] && [ -f "Dionara/package.json" ]; then
            echo "Building from ./Dionara directory..."
            cd Dionara
            npm ci
            npm run build
            cp dist/index.html dist/404.html
            echo "BUILD_DIR=Dionara/dist" >> $GITHUB_ENV
          else
            echo "Building from root directory..."
            npm ci
            npm run build
            cp dist/index.html dist/404.html
            echo "BUILD_DIR=dist" >> $GITHUB_ENV
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
